# vim:set ft=tmux:
# session management
bind a popup -w 85% -h 85% -E "~/.local/bin/fzf_session"
bind s run -C 'choose-tree -s -O time; send j' # custom choose-tree
bind w popup -w 85% -h 85% -E "~/.local/bin/fzf_jj_session"

bind -T root a if-shell -F '#{==:#{pane_mode},tree-mode}' {
  popup -w 85% -h 85% -E '~/.local/bin/fzf_session'
}{
  send a
}
bind -T root s if-shell -F '#{==:#{pane_mode},tree-mode}' {
  popup -w 85% -h 85% -E '~/.local/bin/fzf_ssh_session'
}{
  send s
}
bind -T root w if-shell -F '#{==:#{pane_mode},tree-mode}' {
  popup -w 85% -h 85% -E '~/.local/bin/fzf_jj_session'
}{
  send w
}

# Layouts
bind e selectl -E;
bind g run 'source ~/.local/bin/jj-term'
bind l run 'source ~/.local/bin/agent-term'

