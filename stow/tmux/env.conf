# vim:set ft=tmux:
# terminal specific settings
# set -s default-terminal "$TERM"
# set -us terminal-overrides # reset term overrides
#
# set -as terminal-features ",xterm-ghostty:Tc,xterm-ghostty:hyperlinks,xterm-ghostty:mouse;xterm-ghostty:sixel;xterm-ghostty:RGB,xterm-ghostty:256,xterm-ghostty:clipboard,xterm-ghostty:focus"

# environment
set -g default-shell $SHELL
if "[[ $(uname) == 'Darwin' ]]" {
  setenv -g PATH "$HOME/bin/hosts/$(hostname):$HOME/.dotfiles/bin/shared:$HOME/.nix-profile/bin:/etc/profiles/per-user/$USER/bin:/nix/var/nix/profiles/default/bin:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/bin:/usr/bin"
}{
  setenv -g PATH "$HOME/bin/hosts/$(hostname):$HOME/.dotfiles/bin/shared:$HOME/.nix-profile/bin:/etc/profiles/per-user/$USER/bin:/nix/var/nix/profiles/default/bin:$HOME/.cargo/bin:/bin:/usr/bin"
  # On Linux, whenever a client attaches, set these environment variables
  # base on the incoming client
  set-option -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK XDG_SESSION_TYPE XDG_SESSION_DESKTOP GPG_TTY XDG_CURRENT_DESKTOP XDG_SEAT SWAYSOCK XDG_SESSION_CLASS XDG_SESSION_ID DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR COLORTERM"
}
