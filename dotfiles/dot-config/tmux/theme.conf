# tmux themes
set -g @plugin 'catppuccin/tmux#v2.1.0'

# colors
%hidden colorscheme='$(cat "$HOME/.local/state/colorscheme/colorscheme")'
if "echo $colorscheme | grep -qE 'catppuccin-'" {
  set -ug @catppuccin_flavor
  set -ug @thm_blue
  set -ug @thm_green
  set -ug @thm_mauve
  set -ug @thm_peach
  set -ug @thm_lavender
  set -ug @thm_red
  set -ug @thm_yellow

  set -ug @thm_surface_0
  set -ug @thm_surface_1
  set -ug @thm_overlay_0
  set -ug @thm_bg
  set -ug @thm_fg

  set -ug @catppuccin_status_session_text_fg
  set -ug @catppuccin_status_host_text_fg
}
source "$HOME/.config/tmux/plugins/tmux/catppuccin_options_tmux.conf"
if "echo $colorscheme | grep -qE '.'" {

  if "[ $colorscheme = 'catppuccin-mocha' ]" { set -g @catppuccin_flavor "mocha" }
  if "[ $colorscheme = 'catppuccin-macchiato' ]" { set -g @catppuccin_flavor "macchiato" }
  if "[ $colorscheme = 'catppuccin-frappe' ]" { set -g @catppuccin_flavor "frappe" }
  if "[ $colorscheme = 'catppuccin-latte' ]" {
    set -g @catppuccin_flavor "latte"
  }
  if "[ $colorscheme = 'tokyonight-night' ]" {
    set -g @catppuccin_flavor "mocha"
    set -g @thm_blue "#7aa2f7" # blue
    set -g @thm_green "#9ece6a" # green
    set -g @thm_lavender "#bb9af7" # magenta
    set -g @thm_peach "#ff9e64" # orange
    set -g @thm_mauve "#9d7cd8" # purple
    set -g @thm_red "#f7768e" #red
    set -g @thm_yellow "#e0af68" # yellow

    set -g @thm_bg "#1a1b26" # bg
    set -g @thm_fg "#c0caf5" # fg
    set -g @thm_surface_0 "#292e42" # bg_highlight
    set -g @thm_surface_1 "#1a1b26" # bg
    set -g @thm_overlay_0 "#a9b1d6" # fg_sidebar
  }
  if "[ $colorscheme = 'tokyonight-moon' ]" {
    set -g @catppuccin_flavor "macchiato"
    set -g @thm_blue "#82aaff" # blue
    set -g @thm_green "#c3e88d" # green
    set -g @thm_lavender "#c099ff" # magenta
    set -g @thm_peach "#ff966c" # orange
    set -g @thm_mauve "#fca7ea" # purple
    set -g @thm_red "#ff757f" #red
    set -g @thm_yellow "#ffc777" # yellow

    set -g @thm_overlay_0 "#828bb8" # fg_sidebar
    set -g @thm_bg "#222436" # bg
    set -g @thm_surface_0 "#2f334d" # bg_highlight
    set -g @thm_surface_1 "#222436" # bg
    set -g @thm_fg "#c8d3f5" # fg
  }
  if "[ $colorscheme = 'tokyonight-storm' ]" {
    set -g @catppuccin_flavor "frappe"
    set -g @thm_blue "#7aa2f7" # blue
    set -g @thm_green "#9ece6a" # green
    set -g @thm_lavender "#bb9af7" # magenta
    set -g @thm_peach "#ff9e64" # orange
    set -g @thm_mauve "#9d7cd8" # purple
    set -g @thm_red "#f7768e" #red
    set -g @thm_yellow "#e0af68" # yellow

    set -g @thm_bg "#24283b" # bg
    set -g @thm_fg "#c0caf5" # fg
    set -g @thm_surface_0 "#292e42" # bg_highlight
    set -g @thm_surface_1 "#24283b" #bg
    set -g @thm_overlay_0 "#a9b1d6" # fg_sidebar
  }
  if "[ $colorscheme = 'tokyonight-day' ]" {
    set -g @catppuccin_flavor "latte"
    set -g @thm_blue "#2e7de9" # blue
    set -g @thm_green "#587539" # green
    set -g @thm_lavender "#9854f1" # magenta
    set -g @thm_peach "#b15c00" # orange
    set -g @thm_mauve "#7847bd" # purple
    set -g @thm_red "#f52a65" #red
    set -g @thm_yellow "#8c6c3e" # yellow

    set -g @thm_bg "#e1e2e7" # bg
    set -g @thm_fg "#3760bf" # fg
    set -g @thm_surface_0 "#c4c8da" # bg_highlight
    set -g @thm_surface_1 "#e1e2e7" # bg
    set -g @thm_overlay_0 "#6172b0" # fg_sidebar
  }

  set -g @catppuccin_window_number_color "#{@thm_blue}"
  set -g @catppuccin_window_current_number_color "#{@thm_peach}"
}


# Windows
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Right side
set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "yes"

source "$HOME/.config/tmux/plugins/tmux/catppuccin_tmux.conf"

# General resets
set -g status-left ""
set -g status-left-length 100
set -g status-right "#{E:@catppuccin_status_session} "
set -agF status-right "#{E:@catppuccin_status_host} "
set -g status-right-length 100
set -g status-style "#{@thm_bg}"

