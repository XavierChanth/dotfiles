# vim:set ft=tmux:
# terminal specific settings
set -s default-terminal "$TERM"
set -us terminal-overrides # reset term overrides

if "[ \"$TERM\" = 'wezterm' ] && [ -z \"$SSH_TTY\" ]" {
    set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
    set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
    set -as terminal-features ",$TERM:RGB"
} {
  set -s default-terminal "tmux-256color"
  set -as terminal-features ",tmux-256color:RGB"
}

# environment
set -g default-shell $SHELL
if "[[ $(uname) == 'Darwin' ]]" {
  setenv -g PATH "/opt/homebrew/bin:/bin:/usr/bin"
}{
  setenv -g PATH "$HOME/.cargo/bin:/bin:/usr/bin"
  # Whenever a client attaches, set these environment variables from the client's perspective
  set-option -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK XDG_SESSION_TYPE XDG_SESSION_DESKTOP GPG_TTY XDG_CURRENT_DESKTOP XDG_SEAT SWAYSOCK XDG_SESSION_CLASS XDG_SESSION_ID DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR"
}
