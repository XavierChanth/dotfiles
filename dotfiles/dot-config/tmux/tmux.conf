%hidden is_macos="[[ $(uname) == 'Darwin' ]]"
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
%hidden is_vim_or_aerc="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|aerc)(diff)?$'"

# terminal specific settings
set -s default-terminal "$TERM"
set -us terminal-overrides # reset term overrides
if "[ \"$TERM\" = 'wezterm' ] && [ -z \"$SSH_TTY\" ]" {
    set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
    set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
    set -as terminal-features ",$TERM:RGB"
} {
  set -s default-terminal "tmux-256color"
  set -as terminal-features ",tmux-256color:RGB"
}

# environment
set -g default-shell $SHELL
if "$is_macos" {
  setenv -g PATH "/opt/homebrew/bin:/bin:/usr/bin"
}{
  setenv -g PATH "/home/linuxbrew/.linuxbrew/bin:/bin:/usr/bin"
}
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# reload configuration key bind
unbind r
bind -r r source "$HOME/.config/tmux/tmux.conf"

# use C-space as the prefix
set-option -g prefix C-space
bind C-space send-prefix

# general settings
set -g mouse on
set -g history-limit 25000
set -g status-position top

# from tmux-sensible
set -g focus-events on
set -g automatic-rename on
setw -g aggressive-resize on
bind C-p previous-window
bind C-n next-window

# nvim qol
set -sg escape-time 0
set -g detach-on-destroy off

# count the panes from 1
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# vi mode
setw -g mode-keys vi

# neovim splits navigation (vim-tmux-navigator)
bind -n 'C-h' if-shell "$is_vim_or_aerc" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim_or_aerc" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim_or_aerc" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim_or_aerc" 'send-keys C-l'  'select-pane -R'

bind 'C-h' select-pane -L
bind 'C-j' select-pane -D
bind 'C-k' select-pane -U
bind 'C-l' select-pane -R

# vi-like copy-mode
bind v copy-mode
bind -T copy-mode-vi Escape copy-mode -q

# visual mode in vi copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# yank / paste in vi mode
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind p paste-buffer

# splits
bind \\ 'splitw -h -c "#{pane_current_path}"'
bind - 'splitw -v -c "#{pane_current_path}"'

# session management
bind a popup -w 85% -h 85% -E "~/.local/bin/fzf_session" # fzf add session
bind s run -C 'choose-tree -s -O time; send j' # open choose-tree sorted by recency, with previous pane selected
# https://unix.stackexchange.com/questions/759401/is-there-a-way-to-customize-the-keys-in-tmuxs-choose-mode
bind -T root a if-shell -F '#{==:#{pane_mode},tree-mode}' { 
  popup -w 85% -h 85% -E '~/.local/bin/fzf_session'
}{
  send a
}
bind -T root s if-shell -F '#{==:#{pane_mode},tree-mode}' "popup -w 85% -h 85% -E '~/.local/bin/fzf_ssh_session'" 'send s'
bind -T root n if-shell -F '#{==:#{pane_mode},tree-mode}' "popup -w 85% -h 85% -E '~/.local/bin/mkproj'" 'send n'
bind -T root d if-shell -F '#{==:#{pane_mode},tree-mode}' 'send x' 'send d'

# layouts
bind l popup -w 85% -h 85% -E 'source ~/.config/tmux/scripts/layout.sh && fzf_layout'

# plugins
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'mkdir -p ~/.config/tmux/plugins && git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'

# tmux-suspend
set -g @plugin 'xavierchanth/tmux-suspend'
set -g @suspend_key 'M-z'
set -g @suspend_on_suspend_command "tmux rename-session '#S 🔒'"
set -g @suspend_on_resume_command "tmux rename-session \"$(tmux display-message -p '#S' | sed 's/ 🔒$//')\" "

# tmux-resurrect
set -g @plugin 'xavierchanth/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# tmux themes
set -g @plugin 'catppuccin/tmux'

# General resets
set -g status-left ""

# Windows
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Right side
set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "yes"
set -g status-right "#{E:@catppuccin_status_session} "
set -ag status-right "#{E:@catppuccin_status_host} "
set -g status-right-length 100

# colors
%hidden colorscheme='$(cat "$HOME/.local/state/colorscheme/colorscheme")'
if "echo $colorscheme | grep -qE '.'" {
  set -ug @catppuccin_flavor
  set -ug @thm_blue
  set -ug @thm_green
  set -ug @thm_mauve
  set -ug @thm_peach
  set -ug @thm_lavender
  set -ug @thm_red
  set -ug @thm_yellow

  set -ug @thm_surface_0
  set -ug @thm_surface_1
  set -ug @thm_overlay_0
  set -ug @thm_bg
  set -ug @thm_fg

  set -ug @catppuccin_status_session_text_fg
  set -ug @catppuccin_status_host_text_fg

  set -g @catppuccin_window_number_color "#{@thm_blue}"
  set -g @catppuccin_window_current_number_color "#{@thm_peach}"


  if "[ $colorscheme = 'catppuccin-mocha' ]" { set -g @catppuccin_flavor "mocha" }
  if "[ $colorscheme = 'catppuccin-macchiato' ]" { set -g @catppuccin_flavor "macchiato" }
  if "[ $colorscheme = 'catppuccin-frappe' ]" { set -g @catppuccin_flavor "frappe" }
  if "[ $colorscheme = 'catppuccin-latte' ]" {
    set -g @catppuccin_flavor "latte"
  }
  if "[ $colorscheme = 'tokyonight-night' ]" {
    set -g @catppuccin_flavor "mocha"
    set -g @thm_blue "#7aa2f7" # blue
    set -g @thm_green "#9ece6a" # green
    set -g @thm_lavender "#bb9af7" # magenta
    set -g @thm_peach "#ff9e64" # orange
    set -g @thm_mauve "#9d7cd8" # purple
    set -g @thm_red "#f7768e" #red
    set -g @thm_yellow "#e0af68" # yellow

    set -g @thm_bg "#1a1b26" # bg
    set -g @thm_fg "#c0caf5" # fg
    set -g @thm_surface_0 "#292e42" # bg_highlight
    set -g @thm_surface_1 "#1a1b26" # bg
    set -g @thm_overlay_0 "#a9b1d6" # fg_sidebar
  }
  if "[ $colorscheme = 'tokyonight-moon' ]" {
    set -g @catppuccin_flavor "macchiato"
    set -g @thm_blue "#82aaff" # blue
    set -g @thm_green "#c3e88d" # green
    set -g @thm_lavender "#c099ff" # magenta
    set -g @thm_peach "#ff966c" # orange
    set -g @thm_mauve "#fca7ea" # purple
    set -g @thm_red "#ff757f" #red
    set -g @thm_yellow "#ffc777" # yellow

    set -g @thm_overlay_0 "#828bb8" # fg_sidebar
    set -g @thm_bg "#222436" # bg
    set -g @thm_surface_0 "#2f334d" # bg_highlight
    set -g @thm_surface_1 "#222436" # bg
    set -g @thm_fg "#c8d3f5" # fg
  }
  if "[ $colorscheme = 'tokyonight-storm' ]" {
    set -g @catppuccin_flavor "frappe"
    set -g @thm_blue "#7aa2f7" # blue
    set -g @thm_green "#9ece6a" # green
    set -g @thm_lavender "#bb9af7" # magenta
    set -g @thm_peach "#ff9e64" # orange
    set -g @thm_mauve "#9d7cd8" # purple
    set -g @thm_red "#f7768e" #red
    set -g @thm_yellow "#e0af68" # yellow

    set -g @thm_bg "#24283b" # bg
    set -g @thm_fg "#c0caf5" # fg
    set -g @thm_surface_0 "#292e42" # bg_highlight
    set -g @thm_surface_1 "#24283b" #bg
    set -g @thm_overlay_0 "#a9b1d6" # fg_sidebar
  }
  if "[ $colorscheme = 'tokyonight-day' ]" {
    set -g @catppuccin_flavor "latte"
    set -g @thm_blue "#2e7de9" # blue
    set -g @thm_green "#587539" # green
    set -g @thm_lavender "#9854f1" # magenta
    set -g @thm_peach "#b15c00" # orange
    set -g @thm_mauve "#7847bd" # purple
    set -g @thm_red "#f52a65" #red
    set -g @thm_yellow "#8c6c3e" # yellow

    set -g @thm_bg "#e1e2e7" # bg
    set -g @thm_fg "#3760bf" # fg
    set -g @thm_surface_0 "#c4c8da" # bg_highlight
    set -g @thm_surface_1 "#e1e2e7" # bg
    set -g @thm_overlay_0 "#6172b0" # fg_sidebar
  }
}


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "$HOME/.config/tmux/plugins/tpm/tpm"

# Set this after running tpm to force it
set -g status-style "#{@thm_bg}"
