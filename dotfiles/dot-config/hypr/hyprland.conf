# Hyprland Configuration
# Using WM-agnostic scripts from ~/.local/bin

# Monitor configuration
monitor=,preferred,auto,2
monitor=eDP-1,2880x1920@120Hz,0x0,2

# Environment variables (sourced on startup)
source = ~/.config/env/hyprland

# Input configuration
input {
    kb_layout = us
    kb_variant = ,nodeadkeys
    repeat_delay = 225
    repeat_rate = 40

    touchpad {
        natural_scroll = yes
        scroll_factor = 0.5
        tap-to-click = yes
        disable_while_typing = yes
        clickfinger_behavior = yes
    }

    follow_mouse = 0
}

# General settings
general {
    gaps_in = 8
    gaps_out = 8
    border_size = 0
    layout = dwindle
}

# Decoration
decoration {
    rounding = 0
    drop_shadow = no
}

# Animations
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

# Layout configuration
dwindle {
    preserve_split = yes
    smart_split = no
}

# Window rules
windowrulev2 = float,class:(zoom),title:(zoom)
windowrulev2 = idleinhibit always,class:(zoom),title:(Meeting)
windowrulev2 = float,class:(swayimg|Display)
windowrulev2 = float,title:(Picture-in-Picture)
windowrulev2 = float,title:(Picture in picture)
windowrulev2 = float,class:(org.keepassxc.KeePassXC),title:(Unlock Database - KeePassXC)
windowrulev2 = float,class:(blueman-manager|system-config-printer|.*iwgtk|.*pwvucontrol)
windowrulev2 = pin,class:(blueman-manager|system-config-printer|.*iwgtk|.*pwvucontrol)
windowrulev2 = float,class:(swayimg)
windowrulev2 = idleinhibit always,fullscreen:1

# XWayland compatibility
xwayland {
    force_zero_scaling = yes
}

# Startup applications
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user restart swaync
exec-once = waybar
exec-once = hypridle
exec-once = hyprctl dispatch workspace 3

# Modifiers
$mod = ALT
$mod2 = SUPER
$hypr = SUPER_CTRL_ALT_SHIFT

# Application launcher bindings (using scripts)
bind = $mod, Return, exec, launch-terminal
bind = $mod SHIFT, Return, exec, launch-terminal
bind = $mod, B, exec, launch-browser
bind = $mod SHIFT, B, exec, launch-browser-alt
bind = $mod, V, exec, launch-notes
bind = $mod2, Space, exec, launch-menu
bind = $mod $mod2, Space, exec, launch-menu-run

# Window management
bind = $mod, W, killactive
bind = $mod2, Q, killactive
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, F, togglefloating
bind = $mod, F, togglegroup
bind = $mod, S, togglesplit
bind = $mod, R, pseudo

# Focus movement (vim-style)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Window movement
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Workspace switching
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move container to workspace and follow
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 1, workspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 2, workspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 3, workspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 4, workspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 5, workspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 6, workspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 7, workspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 8, workspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 9, workspace, 9

# Scratchpad
bind = $mod SHIFT, G, movetoworkspace, special
bind = $mod, G, togglespecialworkspace

# Resizing
bind = $mod SHIFT, minus, resizeactive, -50 0
bind = $mod SHIFT, equal, resizeactive, 50 0
bind = $mod SHIFT, 0, resizeactive, exact 50% 100%

# Workspace swapping between monitors
bind = $mod SHIFT, Space, exec, hyprctl dispatch swapactiveworkspaces 0 1
bind = $mod, Space, exec, hyprctl dispatch movecurrentworkspacetomonitor +1

# Media control bindings (using scripts)
bindl = , XF86AudioMute, exec, volume-mute
bindl = , XF86AudioLowerVolume, exec, volume-down
bindl = , XF86AudioRaiseVolume, exec, volume-up
bindl = , XF86AudioPrev, exec, media-prev
bindl = , XF86AudioPlay, exec, media-play-pause
bindl = , XF86AudioNext, exec, media-next
bindl = , XF86MonBrightnessDown, exec, brightness-down
bindl = , XF86MonBrightnessUp, exec, brightness-up
bindl = , XF86PowerOff, exec, wlogout

# Screenshot bindings (using scripts)
bind = , Print, exec, screenshot-region
bind = $hypr, 2, exec, screenshot-region-view
bind = $hypr, 3, exec, screenshot-window
bind = $hypr, 4, exec, screenshot-region

# Laptop lid switch
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1,disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1,2880x1920@120Hz,0x0,2"

# Mouse bindings
bindm = $mod2, mouse:272, movewindow
bindm = $mod2, mouse:273, resizewindow
