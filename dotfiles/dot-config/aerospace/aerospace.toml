start-at-login = true

after-startup-command = [
  'exec-and-forget ~/.local/bin/aerospace-util startup',
  'move-workspace-to-monitor --workspace 2 prev' # start workspace 2 on secondary monitor
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

accordion-padding = 0

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.top = 8
outer.bottom = [{ monitor.built-in = 8 }, { monitor.main = 48 }, 8]
outer.right = 8

[workspace-to-monitor-force-assignment]
1 = 'secondary' # '^Sidecar.*$'

# See https://nikitabobko.github.io/AeroSpace/guide#exec-env-vars
[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin/:${PATH}'

[[on-window-detected]] # "Waiting for host" window on zoom
if.app-id = 'us.zoom.xos'
if.window-title-regex-substring = '^$'
run = "layout floating"

[[on-window-detected]] # mpv windows are buggy when working with multiple monitors
if.app-name-regex-substring = '^mpv$'
run = "layout floating"

[[on-window-detected]] # Firefox (and friends) Picture-in-Picture floats
if.app-name-regex-substring = '^LibreWolf$|^Firefox$|^Zen Browser$'
if.window-title-regex-substring = '^Picture-in-Picture$'
run = "layout floating"

# Startup layout
[[on-window-detected]] # Everything on 1
if.app-name-regex-substring = '.'
if.during-aerospace-startup = true
check-further-callbacks = true
run = 'move-node-to-workspace 1'

[[on-window-detected]] # Browsers and Zed on 2
if.app-name-regex-substring = '^qutebrowser$|^LibreWolf$|^Firefox$|^Zen Browser$|^Safari$|^Zed$'
if.during-aerospace-startup = true
run = 'move-node-to-workspace 2'

[[on-window-detected]] # Terminals on 3
if.app-name-regex-substring = '^alacritty$|^WezTerm$|^wezterm-gui$|^Ghostty$'
if.during-aerospace-startup = true
run = 'move-node-to-workspace 3'

[mode.main.binding]
# General bindings
alt-shift-r = [
  'exec-and-forget aerospace reload-config',
  'exec-and-forget ~/.local/bin/aerospace-util reload',
]

alt-s = 'layout tiles horizontal vertical'
alt-f = 'layout h_accordion tiles'

alt-q = 'enable off'
alt-shift-f = 'layout floating tiling'
alt-shift-space = 'exec-and-forget ~/.local/bin/aerospace-util swap-workspace-monitors --wrap-around next'
alt-space = 'move-workspace-to-monitor --wrap-around next'
alt-r = 'flatten-workspace-tree'
alt-w = 'close'

# Terminal openers (always new)
alt-enter = ['exec-and-forget open -n /Applications/Ghostty.app']
alt-shift-enter = [
  # 'exec-and-forget open -n /Applications/WezTerm.app --args start zsh',
  'exec-and-forget open -n /Applications/Ghostty.app --args -e zsh',
]

# Password manager
alt-p = ['exec-and-forget ~/.local/bin/pass-util pick_password_to_clipboard']
alt-u = ['exec-and-forget ~/.local/bin/pass-util pick_username_to_clipboard']
alt-o = ['exec-and-forget ~/.local/bin/pass-util pick_totp_to_clipboard']

# Go to workspace + app
alt-t = ['workspace 3', 'exec-and-forget open -a /Applications/Ghostty.app']
alt-b = ['workspace 2', 'exec-and-forget open -a /Applications/Zen\ Browser.app/']

# Window movement
alt-h = 'focus left --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
alt-j = 'focus down --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
alt-k = 'focus up --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
alt-l = 'focus right --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Workspace movement
# alt-tab = 'workspace-back-and-forth'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# Resizing
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'
alt-shift-0 = 'balance-sizes'
